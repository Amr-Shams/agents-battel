<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle of Agents</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Battle of Agents</h1>
      <p class="subtitle">Submit a prompt, read three AI perspectives, then pick the best.</p>
    </header>

    <div class="scoreboard" id="scoreboard">
      <span class="score" data-agent="java">Java: <span class="score-count">0</span></span>
      <span class="sep">·</span>
      <span class="score" data-agent="golang">Go: <span class="score-count">0</span></span>
      <span class="sep">·</span>
      <span class="score" data-agent="rust">Rust: <span class="score-count">0</span></span>
    </div>

    <form id="prompt-form" onsubmit="handleSubmit(event)">
      <div class="form-row">
        <input type="text" id="session-input" placeholder="Session" value="default" class="session-input">
        <input type="text" id="prompt-input" placeholder="Enter your prompt for the agents..." class="prompt-input" required>
        <button type="submit" class="btn-submit" id="submit-btn">Send</button>
      </div>
    </form>

    <div id="status-message" class="status-message"></div>
    <div id="error-message" class="error hidden"></div>

    <div class="arena" id="arena">
      <div class="agent-card" data-agent="java">
        <div class="card-header">Java</div>
        <div class="response-body" id="response-java"></div>
        <button class="pick-btn" data-agent="java" disabled>Select as Best</button>
      </div>
      <div class="agent-card" data-agent="golang">
        <div class="card-header">Go</div>
        <div class="response-body" id="response-golang"></div>
        <button class="pick-btn" data-agent="golang" disabled>Select as Best</button>
      </div>
      <div class="agent-card" data-agent="rust">
        <div class="card-header">Rust</div>
        <div class="response-body" id="response-rust"></div>
        <button class="pick-btn" data-agent="rust" disabled>Select as Best</button>
      </div>
    </div>

    <div id="winner-announcement" class="winner-announcement hidden"></div>

    <div class="controls">
      <button id="new-round-btn" class="btn-new-round" onclick="newRound()">New Prompt</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-service
  namespace: prompts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prompt-service
  template:
    metadata:
      labels:
        app: prompt-service
    spec:
      containers:
        - name: prompt-service
          image: prompt-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service:8761/eureka/
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-service
  namespace: prompts
spec:
  selector:
    app: prompt-service
  ports:
    - port: 8003
      targetPort: 8003

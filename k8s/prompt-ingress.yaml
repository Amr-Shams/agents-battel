apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prompt-ingress
  namespace: prompts
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8060
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prompt-ingress
  namespace: prompts
spec:
  rules:
    - http:
        paths:
          - path: /api/prompts
            pathType: Prefix
            backend:
              service:
                name: prompt-service
                port:
                  number: 8003
          - path: /api/responses
            pathType: Prefix
            backend:
              service:
                name: response-service
                port:
                  number: 8004
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
